<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; background: #f0f0f0; }
    button { padding: 20px 40px; font-size: 24px; border-radius: 12px; border: none; background: #007bff; color: white; cursor: pointer; }
    button:active { background: #0056b3; }
  </style>
</head>
<body>

  <button onclick="playRandomSound()">🔊 Zufälliger Sound</button>

  <script>
    // Liste deiner Sprachaufnahmen (Dateinamen)
    const audioFiles = [
      'sound1.mp3',
      'sound2.mp3',
      'sound3.mp3'
    ];

    function playRandomSound() {
      // Wählt eine zufällige Datei aus dem Array
      const randomIndex = Math.floor(Math.random() * audioFiles.length);
      const audio = new Audio(audioFiles[randomIndex]);
      audio.play();
    }
  </script>
</body>
</html>
