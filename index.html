<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard</title>
  <style>
    body { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      font-family: sans-serif; 
      background: #f0f0f0; 
    }
    button { 
      padding: 20px 40px; 
      font-size: 24px; 
      border-radius: 12px; 
      border: none; 
      background: #007bff; 
      color: white; 
      cursor: pointer; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:active { 
      background: #0056b3; 
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <button onclick="playRandomSound()">🔊 Frag mich was!</button>

  <script>
    // ⚙️ ANPASSUNG: Trage hier einfach die Gesamtzahl deiner MP3-Dateien ein!
    const TOTAL_SOUNDS = 19; 

    function playRandomSound() {
      // Erzeugt eine zufällige Zahl zwischen 1 und TOTAL_SOUNDS
      const randomNumber = Math.floor(Math.random() * TOTAL_SOUNDS) + 1;
      
      // Baut den Dateinamen zusammen: z. B. "sound1.mp3", "sound2.mp3", ...
      const fileName = `sound${randomNumber}.mp3`;
      
      // Spielt die Datei ab
      const audio = new Audio(fileName);
      audio.play();
    }
  </script>
</body>
</html>
